<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>E-COMERCE</title>
    
</head>
<body>
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        a {
            text-decoration: none;
            
        }
        .header {
            background-color: #f0f0f0;
            padding: 20px;
            text-align: center;
            text-decoration: none;
           
        }

        .main-content {
            padding: 20px;
            text-align: center;
        }

        .shop-now {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .footer {
            background-color: #f0f0f0;
            padding: 20px;
            text-align: center;
        }
    </style>

    <div class="container">
        <div class="header">
            <h1>MOHA</h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Products</a></li>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>

        <div class="main-content">
            <h2>Welcome to MOHA E-Commerce!</h2>
            <p>Your one-stop shop for all your needs. Explore our wide range of products and enjoy a seamless shopping experience.</p>
            <button class="shop-now">Shop Now</button>
        </div>

        <div class="footer">
            <p>&copy; 2024 MOHA E-Commerce. All rights reserved.</p>
        </div>
    </div>






















</body>
</html>
